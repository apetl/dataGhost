version: 2

project_name: dataGhost

before:
  hooks:
    - go vet ./...

builds:
  - id: dataGhost
    main: ./
    binary: dataGhost
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{ .Os }}_{{ .Arch }}

checksum:
  name_template: 'checksums.txt'

release:
  github:
    owner: apetl
    name: dataGhost
    token: "{{ .Env.RELEASE_GITHUB_TOKEN }}"
  draft: true
  prerelease: auto
  name_template: '{{ .Date.Format "2006-01-02" }} ({{ .ShortCommit }})'

gitea_urls:
  api: https://git.apetl.com/api/v1
  download: https://git.apetl.com

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^Plan:'
